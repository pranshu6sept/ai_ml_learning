$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: blue
endpoint_name: payrag-fraud
# Version 1 was saved without `azureml-ai-monitoring` and crash-loops on start (see notes/week-08.md); never
# deploy it. Register the output of the retrained job as the next version and check this number matches.
model: azureml:fraud-lightgbm:2
# An MLflow model needs no scoring script and no environment: Azure ML builds the serving environment from the
# conda file saved with the model.
instance_type: Standard_DS2_v2   # 2 vCPUs, 0.169 USD an hour for as long as the deployment exists
instance_count: 1
