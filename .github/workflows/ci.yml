name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # run by hand (on main: also deploys)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --group api  # dev and api groups; the others are for local use
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov=classical_ml --cov=payments_rag

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capstone/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  image:
    # Builds capstone/Dockerfile and checks the container serves the API and the page (no Azure needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t payrag-api capstone
      - name: Smoke test
        run: |
          docker run -d --name payrag -p 8000:8000 -e PAYRAG_API_KEY=ci-key payrag-api
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/ask \
            -H 'content-type: application/json' -d '{"question":"hi"}')" = 401
          test "$(docker exec payrag id -un)" = app
      - name: Container log
        if: always()
        run: docker logs payrag || true

  deploy:
    # On a push to main (or a manual run on main), after every check passes: push the image and point the App Service at it.
    # Signs in to Azure with OIDC as the deployer identity from infra/week8.bicep (hosting = 'container');
    # the repository variables below are IDs and names, not secrets. Skipped until they are set.
    needs: [check, frontend, image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    concurrency: deploy-production # one deploy at a time; a newer push waits rather than racing
    permissions:
      id-token: write # to request the OIDC token
      contents: read
    env:
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/payrag-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push the image
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          docker build -t "$IMAGE" capstone
          docker push "$IMAGE"
      - name: Point the app at the new image
        run: |
          az webapp config set -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.WEBAPP_NAME }}" \
            --linux-fx-version "DOCKER|$IMAGE" -o none
      - name: Check the deployed app
        run: |
          url="https://$(az webapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.WEBAPP_NAME }}" --query defaultHostName -o tsv)"
          # The free plan starts the container on the first request after a change; give it up to 5 minutes.
          for i in $(seq 1 30); do
            if curl -sf "$url/health" | grep -q '"configured":true'; then echo "healthy: $url"; exit 0; fi
            sleep 10
          done
          echo "the app did not report healthy and configured within 5 minutes"; exit 1
