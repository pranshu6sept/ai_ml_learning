name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync  # dev group only; notebooks group is for local use
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov=classical_ml --cov=payments_rag

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capstone/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  image:
    # Builds capstone/Dockerfile and checks the container serves the API and the page (no Azure needed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t payrag-api capstone
      - name: Smoke test
        run: |
          docker run -d --name payrag -p 8000:8000 -e PAYRAG_API_KEY=ci-key payrag-api
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/ask \
            -H 'content-type: application/json' -d '{"question":"hi"}')" = 401
          test "$(docker exec payrag id -un)" = app
      - name: Container log
        if: always()
        run: docker logs payrag || true
