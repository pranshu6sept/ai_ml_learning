name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --group api  # dev and api groups; the others are for local use
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov=classical_ml --cov=payments_rag
      - name: Eval gate
        # Fails when golden-set scores fall below capstone/evals/gate.json, or when a prompt was
        # edited without re-running the evaluation (the committed results name the prompt version).
        run: uv run python capstone/evals/eval_gate.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t payrag-api capstone
      - name: Smoke test
        # No Azure settings here, so the service must still start and say it is not configured;
        # /ask must refuse a request without the key.
        run: |
          docker run -d --name smoke -p 8000:8000 -e PAYRAG_API_KEY=smoke-test-key payrag-api
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep '"status":"ok"'
          curl -sf -o /dev/null localhost:8000/
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"question":"hi"}' localhost:8000/ask)" = 401
          test "$(docker exec smoke id -u)" != 0
      - name: Logs on failure
        if: failure()
        run: docker logs smoke

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capstone/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  deploy:
    # Runs only on a push to main after every check passed, and only once the repository variables below
    # exist, so the pipeline stays green on a fork or before Azure is set up. It signs in to Azure with
    # GitHub's OIDC token as the deployer identity from infra/week8.bicep: there is no Azure secret in this
    # repository. That identity can push images to one registry and manage one web app, and Entra ID accepts
    # its token only for a push to main of this repository.
    needs: [check, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    concurrency: deploy-production # one deploy at a time; a newer push waits instead of racing
    permissions:
      id-token: write # to request the OIDC token
      contents: read
    env:
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/payrag-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push the image
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          docker build -t "$IMAGE" capstone
          docker push "$IMAGE"
      - name: Point the app at the new image
        run: |
          az webapp config set -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.WEBAPP_NAME }}" \
            --linux-fx-version "DOCKER|$IMAGE" -o none
      - name: Wait for the app to restart and check it is healthy
        # /health does not say which image answered, so pause first to let the old instance be replaced.
        # A pass means "healthy and configured", not "this exact image".
        run: |
          sleep 45
          host=$(az webapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.WEBAPP_NAME }}" --query defaultHostName -o tsv)
          for i in $(seq 1 30); do
            body=$(curl -s -m 20 "https://$host/health" || true)
            echo "$(date +%T) $body"
            echo "$body" | grep -q '"configured":true' && exit 0
            sleep 10
          done
          echo "the app did not report healthy and configured within 5 minutes" >&2
          exit 1
