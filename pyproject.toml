[project]
name = "ai-ml-learning"
version = "0.1.0"
description = "12-week Azure GenAI/ML learning repo: classical ML project and a production-grade RAG capstone."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "lightgbm>=4.7.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "scikit-learn>=1.5",
    "shap>=0.51.0",
    "snowballstemmer>=3.1.1",
    "torch>=2.14.1",
    "xgboost>=3.2.0",
]

[dependency-groups]
azure = [
    "azure-identity>=1.26.0",
    "azure-search-documents>=12.0.0",
    "azure-storage-blob>=12.19.0",
    "openai>=3.24.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pandas-stubs>=2.2",
]
embeddings = [
    "sentence-transformers>=6.1.0",
]
notebooks = [
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.2",
    "matplotlib>=3.11.2",
]
orchestration = [
    "langgraph>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["classical_ml/src/classical_ml", "capstone/src/payments_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/notebooks/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.pep8-naming]
# Capital X for feature matrices is the scikit-learn convention.
ignore-names = ["X", "X_*"]

[tool.ruff.lint.isort]
known-first-party = ["classical_ml", "payments_rag"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["classical_ml/src", "capstone/src"]
packages = ["classical_ml", "payments_rag"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "snowballstemmer", "sentence_transformers", "azure.*", "openai", "langgraph.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["classical_ml/tests", "capstone/tests"]
pythonpath = ["classical_ml/src", "capstone/src"]
addopts = "-q"
