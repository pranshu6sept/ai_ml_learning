[project]
name = "ai-ml-learning"
version = "0.1.0"
description = "12-week Azure GenAI/ML learning repo: classical ML project and a production-grade RAG capstone."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["classical_ml/src/classical_ml", "capstone/src/payments_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/notebooks/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["classical_ml", "payments_rag"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["classical_ml/src", "capstone/src"]
packages = ["classical_ml", "payments_rag"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["classical_ml/tests", "capstone/tests"]
pythonpath = ["classical_ml/src", "capstone/src"]
addopts = "-q"
